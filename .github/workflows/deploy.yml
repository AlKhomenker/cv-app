# Builds the page and publishes it to GitHub Pages.
#
# The repository is named cv-app, so this is a PROJECT SITE: it is served under
# the repository name, at https://alkhomenker.github.io/cv-app/. Only a
# repository named AlKhomenker.github.io answers at the root of the domain.
#
# The path in front makes no difference to the build: vite.config.ts sets
# `base: "./"`, so every asset is referenced relatively and the same dist/
# works at a root, under a path, or opened from disk.
#
# Before the first run, set Settings -> Pages -> Source to "GitHub Actions".
# Without it every deploy fails with a 404 from the deployment API.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Writing a Pages deployment and minting the OIDC token it is claimed with;
# everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a cancelled deploy can
# leave the site on a half-published version.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the version from package.json `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `tsc --noEmit && vite build`. It fails if public/cv/*.pdf is missing —
      # see the requireCv plugin in vite.config.ts.
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
